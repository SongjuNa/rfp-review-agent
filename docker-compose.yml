services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rfp
      POSTGRES_PASSWORD: rfp
      POSTGRES_DB: rfp
    ports:
      # 맥·윈도우에 PostgreSQL이 따로 켜져 있어도 겹치지 않게 내 컴퓨터 쪽은 5433번을 쓴다
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfp -d rfp"]
      interval: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://rfp:rfp@db:5432/rfp
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      # 화면에서 올린 docx를 data/private/uploads에 저장하므로 쓰기 가능하게 붙인다
      - ./data/private:/app/data/private
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --port 5173"
    environment:
      VITE_API_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
